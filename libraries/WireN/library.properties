sentence=Wire (I2C) with enlarged buffers for 128 byte EEPROM page transfers.
paragraph=Reconstructed from the Arduino AVR core Wire library (1.8.8). Only BUFFER_LENGTH and TWI_BUFFER_LENGTH differ (32 -> 132), which is what the Yocto firmware needs to write/read a full 128 byte EEPROM page plus its 2 address bytes in one transaction.
